# Firebase App Hosting (Cloud Run) settings. Deploy: firebase deploy --only apphosting
runConfig:
  minInstances: 0   # scale to zero: costs nothing when nobody visits
  maxInstances: 1   # one server = one catalogue cache, so an admin save is visible at once (80 visitors at a time is plenty)
  concurrency: 80
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://zanespuskisi.lv
  - variable: WHATSAPP_PHONE
    secret: WHATSAPP_PHONE   # existing Secret Manager secret, used by /wa
    availability: [RUNTIME]
